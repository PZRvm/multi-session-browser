<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>多会话录屏</title>
    <style>
      /* 深浅双主题：跟随系统；单层表面铺满弹窗 */
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2329;
        --fg-soft: #6b7076;
        --line: #d9dce1;
        --btn-bg: #ffffff;
        --btn-line: #b9bcc2;
        --danger: #c5493c;
        --error: #c5493c;
        --tip-bg: #2a2e33;
        --tip-fg: #e8eaed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e2126;
          --fg: #e8eaed;
          --fg-soft: #9aa0a6;
          --line: #3c4043;
          --btn-bg: #2a2e33;
          --btn-line: #4a4f55;
          --danger: #e05a4c;
          --error: #ff8a7d;
          --tip-bg: #e8eaed;
          --tip-fg: #1f2329;
        }
      }
      html,
      body {
        background: var(--bg);
      }
      body {
        font: 13px/1.5 system-ui, -apple-system, 'PingFang SC', sans-serif;
        margin: 0;
        min-width: 260px;
        color: var(--fg);
      }
      main {
        padding: 12px 14px;
      }
      .state-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--fg-soft);
        flex: none;
      }
      .dot.starting {
        background: #e6a23c;
      }
      .dot.recording {
        background: var(--danger);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .dot.paused {
        background: #4c8bf5;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .state {
        font-size: 15px;
        font-weight: 600;
      }
      .result {
        color: var(--fg-soft);
        font-size: 11px;
        margin-top: 4px;
      }
      .result:empty {
        display: none;
      }
      .error {
        color: var(--error);
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .error:empty {
        display: none;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        align-items: stretch;
      }
      /* icon 按钮：tooltip 用 data-tip 呈现；结束录制为文字按钮（用户指定文案「结束」） */
      .iconbtn {
        position: relative;
        width: 38px;
        height: 34px;
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--btn-line);
        border-radius: 8px;
        background: var(--btn-bg);
        color: var(--fg);
        cursor: pointer;
        padding: 0;
      }
      .iconbtn svg {
        width: 16px;
        height: 16px;
        display: block;
        fill: currentColor;
      }
      .iconbtn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .stopbtn {
        flex: 1;
        height: 34px;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid var(--danger);
        border-radius: 8px;
        background: var(--danger);
        color: #fff;
        cursor: pointer;
        position: relative;
      }
      .stopbtn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .iconbtn.primary {
        background: var(--danger);
        border-color: var(--danger);
        color: #fff;
      }
      .iconbtn.primary:disabled {
        opacity: 0.45;
      }
      .iconbtn.danger-soft:hover:not(:disabled) {
        color: var(--danger);
        border-color: var(--danger);
      }
      .iconbtn[data-tip]:hover::after,
      .iconbtn[data-tip]:focus-visible::after,
      .stopbtn[data-tip]:hover::after,
      .stopbtn[data-tip]:focus-visible::after {
        content: attr(data-tip);
        position: absolute;
        top: calc(100% + 6px);
        left: 50%;
        transform: translateX(-50%);
        background: var(--tip-bg);
        color: var(--tip-fg);
        font-size: 11px;
        line-height: 1.4;
        padding: 5px 8px;
        border-radius: 6px;
        white-space: nowrap;
        z-index: 10;
        pointer-events: none;
      }
      .iconbtn.audio.off {
        color: var(--fg-soft);
      }
      .iconbtn.audio.off svg .wave {
        display: none;
      }
      .iconbtn.audio.off::before {
        content: '';
        position: absolute;
        width: 18px;
        height: 1.5px;
        background: var(--danger);
        transform: rotate(-45deg);
        border-radius: 1px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="state-row">
        <span class="dot" id="dot"></span>
        <span class="state" id="state">未知</span>
      </div>
      <div class="result" id="result"></div>
      <div class="error" id="error" role="alert"></div>
      <div class="row">
        <button id="start" class="iconbtn primary" data-tip="开始录制当前标签页" aria-label="开始录制">
          <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" /></svg>
        </button>
        <button id="pause" class="iconbtn" data-tip="暂停" aria-label="暂停" disabled>
          <svg viewBox="0 0 16 16"><rect x="4" y="3" width="3" height="10" rx="1" /><rect x="9" y="3" width="3" height="10" rx="1" /></svg>
        </button>
        <button id="resume" class="iconbtn" data-tip="恢复" aria-label="恢复" disabled>
          <svg viewBox="0 0 16 16"><path d="M5 3.5v9a.8.8 0 0 0 1.22.68l7-4.5a.8.8 0 0 0 0-1.36l-7-4.5A.8.8 0 0 0 5 3.5z" /></svg>
        </button>
        <button id="cancel" class="iconbtn danger-soft" data-tip="取消（丢弃本次录像）" aria-label="取消录制" disabled>
          <svg viewBox="0 0 16 16"><path d="M4.1 4.1a.75.75 0 0 1 1.06 0L8 6.94l2.84-2.84a.75.75 0 1 1 1.06 1.06L9.06 8l2.84 2.84a.75.75 0 1 1-1.06 1.06L8 9.06l-2.84 2.84a.75.75 0 1 1-1.06-1.06L6.94 8 4.1 5.16a.75.75 0 0 1 0-1.06z" /></svg>
        </button>
        <button id="stop" class="stopbtn" data-tip="结束录制并保存 MP4" aria-label="结束录制" disabled>
          结束
        </button>
        <button id="audio" class="iconbtn audio" data-tip="录制 Tab 音频：改后下次生效；录制中切换为即时静音" aria-label="录制 Tab 音频">
          <svg viewBox="0 0 16 16">
            <path d="M8 2a2.2 2.2 0 0 1 2.2 2.2v3.6a2.2 2.2 0 0 1-4.4 0V4.2A2.2 2.2 0 0 1 8 2z" />
            <path class="wave" d="M4 7.8a.65.65 0 0 1 1.3 0 2.7 2.7 0 0 0 5.4 0 .65.65 0 0 1 1.3 0 4 4 0 0 1-3.35 3.94v1.31a.65.65 0 0 1-1.3 0v-1.31A4 4 0 0 1 4 7.8z" />
          </svg>
        </button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
