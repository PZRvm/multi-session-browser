name: Extensions Release

# 自研插件 CRX 独立发布（2026-11-13，Release 附件配置化调研定稿：CI 现场打包 +
# 独立工作流——CRX 与应用版本解耦，不是每次应用发版都带 CRX；手动触发）。
# 发布链（避开 release.mjs 草稿 404 教训）：现场打包 → 非草稿直发 → 按字节校验附件。
# tag 约定 crx-<UTC 时间戳>；应用 v* Release 与本工作流互不干扰。
on:
  workflow_dispatch:
    inputs:
      screenshot_only:
        description: 仅发布截图插件
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: extensions-release
  cancel-in-progress: false

jobs:
  release:
    name: 打包并发布 CRX
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 截图插件编辑器 bundle（录屏纯静态无需构建）
      - name: 构建截图编辑器 bundle
        run: node extensions/build.mjs
      # PEM 经 Secrets 注入临时文件（base64 单行），步末清理
      - name: 还原签名私钥
        env:
          RECORDER_PEM_B64: ${{ secrets.RECORDER_PEM_B64 }}
          SCREENSHOT_PEM_B64: ${{ secrets.SCREENSHOT_PEM_B64 }}
        run: |
          if [[ "${{ inputs.screenshot_only }}" != "true" ]]; then
            echo "$RECORDER_PEM_B64" | base64 -d > /tmp/recorder.pem
          fi
          echo "$SCREENSHOT_PEM_B64" | base64 -d > /tmp/screenshot.pem
      - name: 现场打包 CRX
        run: |
          mkdir -p dist/crx
          if [[ "${{ inputs.screenshot_only }}" != "true" ]]; then
            node tools/extension-preflight/pack-release.mjs extensions/recorder /tmp/recorder.pem dist/crx/recorder.crx
          fi
          node tools/extension-preflight/pack-release.mjs extensions/screenshot /tmp/screenshot.pem dist/crx/screenshot.crx dist/crx/screenshot-chrome.zip
          ( cd dist/crx && shasum -a 256 *.crx *.zip > SHA256SUMS.txt )
          rm -f /tmp/recorder.pem /tmp/screenshot.pem
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crx-release
          path: dist/crx/*
          if-no-files-found: error
          retention-days: 14
      - name: 发布 Release（非草稿直发）
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="crx-$(date -u +%Y%m%d%H%M)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          SHOT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('extensions/screenshot/manifest.json','utf8')).version)")
          TITLE="多会话截图 v$SHOT"
          REC_ROW=""
          if [[ -f dist/crx/recorder.crx ]]; then
            REC=$(node -e "console.log(JSON.parse(require('fs').readFileSync('extensions/recorder/manifest.json','utf8')).version)")
            REC_ROW="| 多会话录屏 | $REC | \`recorder.crx\` |"
            TITLE="多会话插件包 ${TAG#crx-}"
          fi
          gh release create "$TAG" \
            dist/crx/*.crx dist/crx/*.zip dist/crx/SHA256SUMS.txt \
            --title "$TITLE" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --notes "$(cat <<NOTES
          自研插件 CRX 独立发布（CI 现场打包，源码即本工作流检出提交）。

          | 插件 | 版本 | 文件 |
          | --- | --- | --- |
          | 多会话截图 | ${SHOT} | \`screenshot.crx\` |
          $REC_ROW

          截图插件先复制原始 PNG，再在工具栏下方提供下载和编辑入口。编辑器自动完整显示大图。
          普通 Chrome 157 起支持后台复制。下载并解压 screenshot-chrome.zip，在开发者模式选择「加载已解压的扩展程序」。
          多会话浏览器使用 screenshot.crx，需配合带截图 Popover 宿主接口的应用，公开版 1.1.11 及更早版本尚未包含该接口。

          设置「插件」→「导入插件」选择 .crx 安装，或拖入设置窗；SHA256SUMS.txt 提供校验和。
          同 pem 同 ID：覆盖安装即升级，已装旧版直接导入新版即可。
          NOTES
          )"
      - name: 发布对账（字节数与 SHA256 逐文件核对）
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          sleep 3
          for path in dist/crx/*.crx dist/crx/*.zip dist/crx/SHA256SUMS.txt; do
            f=$(basename "$path")
            LOCAL=$(shasum -a 256 "$path" | awk '{print $1}')
            REMOTE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$RELEASE_TAG" --jq ".assets[] | select(.name == \"$f\") | .digest")
            test "$REMOTE" = "sha256:$LOCAL" || { echo "校验不一致：$f"; exit 1; }
          done
          echo "附件对账通过：$RELEASE_TAG"
