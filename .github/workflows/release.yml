name: Release

# 普通 push、标签、未合并便关闭的 PR 均不发布。
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 校验发布提交
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - id: version
        run: node scripts/release.mjs version

  build:
    name: 构建 ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
            target: dmg
            extension: dmg
          - os: macos-15-intel
            platform: mac
            arch: x64
            target: dmg
            extension: dmg
          - os: windows-2025
            platform: win
            arch: x64
            target: nsis
            extension: exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      # 镜像沿用仓库 .npmrc（npmmirror，GitHub runner 实测可达——npm ci 同源下载
      # electron 二进制已通过）。不在此处钉 env 覆盖：npm 执行 scripts 时会以 .npmrc
      # 解析结果注入同名 npm_config_* env，job 级覆盖不生效（第二轮实测 404 教训）；
      # electron 的 customDir 用默认值（= electron 版本）——应用版本号误入 customDir
      # 会拼出 /v<应用版本>/electron-v<electron版本>/ 404 路径（第二轮实测教训）。
      # CLI `-c.` 点属性参数也不可用：Windows runner 默认 PowerShell 会剥掉 `-c`
      # 前缀使 electron-builder 把余串当配置文件路径打开（第一轮实测 ENOENT）。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: 生成安装包
        run: >-
          npm exec electron-builder --
          --${{ matrix.platform }} ${{ matrix.target }} --${{ matrix.arch }}
          --publish never
      - name: 校验 macOS 临时签名与镜像
        if: runner.os == 'macOS'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          app_dir=dist/mac
          if [[ "$RELEASE_ARCH" == arm64 ]]; then app_dir=dist/mac-arm64; fi
          codesign --verify --deep --strict "$app_dir/多会话浏览器.app"
          hdiutil verify "dist/multi-session-browser-$RELEASE_VERSION-mac-$RELEASE_ARCH.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.${{ matrix.extension }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: 发布 GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    # 按版本串行，避免不同 PR 对同一版本并发上传。
    concurrency:
      group: release-version-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: dist/release-assets
          merge-multiple: true
      - name: 校验附件并发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish dist/release-assets
