<!DOCTYPE html>

     沿用「到发信息板」既有视觉世界（token 逐值取自 src/renderer/src/assets/app.css），
     唯一新设计物为板头下「工作区下拉框」（可输入过滤的 combobox）。概念演示用途，

<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作区概念演示 · 多会话测试浏览器</title>
<style>
/* ---------- 语义 token（逐值同源 app.css） ---------- */
:root {
  --board-bg: #f6f4ee;
  --board-bg-raised: #ede9df;
  --board-hairline: #d8d2c5;
  --board-tile: #ede9df;
  --board-tile-line: #d8d2c5;
  --board-tile-ink: #9a5f00;
  --board-tile-seam: rgba(34, 26, 0, 0.2);
  --board-scrollbar-thumb: #c9c1b2;
  --board-scrollbar-hover: #bcb4a6;
  --board-ink: #1e2329;
  --board-ink-dim: #616974;
  --board-hover-veil: rgba(30, 35, 41, 0.08);
  --board-control-line: #bcb4a6;
  --panel-divider: #c7c1b5;
  --amber: #ffb000;
  --amber-strong: #ffc133;
  --amber-press: #e6a000;
  --amber-ink: #221a00;
  --amber-veil: rgba(34, 26, 0, 0.12);
  --idle: #6b7280;
  --loading: #9a5f00;
  --danger: #d4380d;
  --chrome-tabbar: #dee1e6;
  --chrome-toolbar: #f1f3f4;
  --chrome-line: #c7cbd1;
  --chrome-ink: #3c4043;
  --chrome-ink-dim: #5f6368;
  --chrome-disabled: #b0b4b9;
  --chrome-surface: #ffffff;
  --chrome-tab-active: #ffffff;
  --chrome-omnibox-bg: #ffffff;
  --chrome-hover-veil: rgba(60, 64, 67, 0.08);
  --chrome-active-veil: rgba(60, 64, 67, 0.1);
  --chrome-pressed-veil: rgba(60, 64, 67, 0.12);
  --mask: rgba(0, 0, 0, 0.45);
}
html[data-theme='dark'] {
  --board-bg: #101418;
  --board-bg-raised: #1a2026;
  --board-hairline: #232830;
  --board-tile: #1a2026;
  --board-tile-line: #2a313a;
  --board-tile-ink: #ffb000;
  --board-tile-seam: rgba(0, 0, 0, 0.45);
  --board-scrollbar-thumb: #2a313a;
  --board-scrollbar-hover: #3a434e;
  --board-ink: #f5f0e8;
  --board-ink-dim: #9aa3ad;
  --board-hover-veil: rgba(255, 255, 255, 0.08);
  --board-control-line: #3a434e;
  --panel-divider: #0b0e11;
  --loading: #ffb000;
  --danger: #ff7875;
  --chrome-tabbar: #202124;
  --chrome-toolbar: #292a2d;
  --chrome-line: #3c4043;
  --chrome-ink: #e8eaed;
  --chrome-ink-dim: #bdc1c6;
  --chrome-disabled: #5f6368;
  --chrome-surface: #202124;
  --chrome-tab-active: #292a2d;
  --chrome-omnibox-bg: #202124;
  --chrome-hover-veil: rgba(232, 234, 237, 0.08);
  --chrome-active-veil: rgba(232, 234, 237, 0.1);
  --chrome-pressed-veil: rgba(232, 234, 237, 0.14);
  --mask: rgba(0, 0, 0, 0.6);
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  font-size: 13px;
  line-height: 1.5;
  background: var(--board-bg);
  color: var(--board-ink);
  overflow: hidden;
}
button {
  font-family: inherit;
}
::selection {
  background: var(--amber-veil);
}
:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}
.icon {
  width: 1em;
  height: 1em;
  fill: currentColor;
  display: inline-block;
  vertical-align: -0.125em;
  flex: none;
}
.icon-spin {
  animation: icon-spin 1s linear infinite;
}
@keyframes icon-spin {
  to {
    transform: rotate(360deg);
  }
}

/* ---------- 演示窗体外壳 ---------- */
.demo-window {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-width: 720px;
}
.demo-titlebar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: none;
  height: 34px;
  padding: 0 12px;
  border-bottom: 1px solid var(--board-hairline);
  user-select: none;
}
.demo-lights {
  display: inline-flex;
  gap: 8px;
  flex: none;
}
.demo-lights i {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}
.demo-lights i:nth-child(1) {
  background: #ff5f57;
}
.demo-lights i:nth-child(2) {
  background: #febc2e;
}
.demo-lights i:nth-child(3) {
  background: #28c840;
}
.demo-titlebar-name {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.demo-hint {
  margin-left: auto;
  min-width: 0;
  font-size: 11px;
  color: var(--board-ink-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- 布局骨架（同源 app.css） ---------- */
.app-shell {
  display: flex;
  flex: 1;
  min-height: 0;
}
.panel-left {
  flex: none;
  min-width: 220px;
  max-width: 420px;
}
.panel-right {
  flex: 1;
  min-width: 0;
}
.panel-divider {
  flex: none;
  width: 5px;
  margin: 0 -2px;
  z-index: 10;
  cursor: col-resize;
  background: transparent;
  touch-action: none;
}
.panel-divider::before {
  content: '';
  display: block;
  width: 1px;
  height: 100%;
  margin-left: 2px;
  background: var(--panel-divider);
}
.panel-divider:hover::before,
body.col-resizing .panel-divider::before {
  width: 2px;
  background: var(--amber);
}
body.col-resizing {
  cursor: col-resize;
}

/* ---------- 翻牌计数砖（同源 app.css） ---------- */
.flap-counter {
  display: inline-flex;
  gap: 3px;
}
.flap-tile {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 30px;
  background: var(--board-tile);
  border: 1px solid var(--board-tile-line);
  border-radius: 4px;
  perspective: 120px;
  overflow: hidden;
}
.flap-tile::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
  background: var(--board-tile-seam);
  z-index: 1;
}
.flap-digit {
  font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
  font-size: 16px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--board-tile-ink);
  line-height: 1;
}
.flap-flip {
  animation: flap-turn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes flap-turn {
  0% {
    transform: rotateX(-84deg);
  }
  100% {
    transform: rotateX(0deg);
  }
}

/* ---------- 左侧：会话信息板 ---------- */
.session-panel {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--board-bg);
}
.board-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 14px 14px 12px;
  border-bottom: 1px solid var(--board-hairline);
}
.board-title {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--board-ink);
}
.board-title-text {
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.board-head-right {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
}
.appearance-toggle,
.batch-toggle {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--board-ink-dim);
  font-size: 12px;
  cursor: pointer;
  transition: background-color 0.12s ease;
}
.appearance-toggle:not(:disabled):hover,
.batch-toggle:not(:disabled):hover {
  background: var(--board-bg-raised);
}
.batch-toggle.active {
  background: var(--amber);
  color: var(--amber-ink);
}
.board-count {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
}
.board-count-label {
  font-size: 11px;
  color: var(--board-ink-dim);
}

/* ---------- 工作区条（本演示唯一新设计物）：组合框 + 新建钮 ---------- */
.workspace-strip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-bottom: 1px solid var(--board-hairline);
}
.ws-combobox {
  flex: 1;
  min-width: 0;
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  height: 26px;
  padding: 0 10px;
  border: 1px solid var(--board-control-line);
  border-radius: 4px;
  background: var(--board-bg);
  color: var(--board-ink);
  font-size: 13px;
  cursor: pointer;
  transition: border-color 0.12s ease, background-color 0.12s ease;
}
.ws-combobox:hover,
.ws-combobox.open {
  border-color: var(--board-ink-dim);
}
.ws-combobox.open {
  background: var(--board-bg-raised);
}
.ws-combobox-label {
  min-width: 0;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ws-combobox-caret {
  flex: none;
  display: inline-flex;
  font-size: 10px;
  color: var(--board-ink-dim);
  transition: transform 0.12s ease;
}
.ws-combobox.open .ws-combobox-caret {
  transform: rotate(180deg);
}
.ws-add {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  padding: 0;
  border: 1px solid var(--board-control-line);
  border-radius: 4px;
  background: transparent;
  color: var(--board-ink-dim);
  font-size: 10px;
  cursor: pointer;
  transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}
.ws-add:hover {
  border-color: var(--board-ink-dim);
  color: var(--board-ink);
}
/* 下拉面板：板面语系（raised 底 + 发丝线 + 无阴影），顶部过滤输入 + 选项列表 */
.ws-panel {
  position: fixed;
  z-index: 100;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--board-hairline);
  border-radius: 6px;
  background: var(--board-bg-raised);
}
.ws-search-host {
  position: relative;
  flex: none;
  padding: 6px 6px 4px;
}
.ws-search-icon {
  position: absolute;
  left: 14px;
  top: 19px;
  display: inline-flex;
  font-size: 11px;
  color: var(--board-ink-dim);
  pointer-events: none;
}
.ws-search {
  width: 100%;
  height: 26px;
  padding: 0 8px 0 26px;
  border: 1px solid var(--board-control-line);
  border-radius: 4px;
  background: var(--board-bg);
  color: var(--board-ink);
  font-family: inherit;
  font-size: 12px;
}
.ws-search::placeholder {
  color: var(--board-ink-dim);
  opacity: 0.75;
}
.ws-search:focus {
  outline: none;
  border-color: var(--board-ink-dim);
}
.ws-options {
  max-height: 224px;
  overflow-y: auto;
  padding: 0 4px 4px;
}
.ws-options::-webkit-scrollbar {
  width: 8px;
}
.ws-options::-webkit-scrollbar-thumb {
  background: var(--board-scrollbar-thumb);
  border-radius: 4px;
}
.ws-option {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  height: 28px;
  padding: 0 8px;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--board-ink);
  font-family: inherit;
  font-size: 12px;
  text-align: left;
  cursor: pointer;
  white-space: nowrap;
}
.ws-option:hover,
.ws-option.active {
  background: var(--board-hover-veil);
}
.ws-option-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ws-option.current {
  font-weight: 600;
}
.ws-option-check {
  flex: none;
  display: none;
  font-size: 11px;
  color: var(--board-tile-ink);
}
.ws-option.current .ws-option-check {
  display: inline-flex;
}
.ws-option-empty {
  padding: 10px 10px 12px;
  font-size: 12px;
  color: var(--board-ink-dim);
}
.ws-option-create {
  color: var(--board-ink);
}
.ws-option-create .ws-create-icon {
  flex: none;
  display: inline-flex;
  font-size: 10px;
  color: var(--board-tile-ink);
}

/* ---------- 会话列表（同源 app.css） ---------- */
.session-list {
  flex: 1;
  overflow-y: auto;
  list-style: none;
  margin: 0;
  padding: 0;
}
.session-list::-webkit-scrollbar {
  width: 8px;
}
.session-list::-webkit-scrollbar-thumb {
  background: var(--board-scrollbar-thumb);
  border-radius: 4px;
}
.session-list::-webkit-scrollbar-thumb:hover {
  background: var(--board-scrollbar-hover);
}
.session-list::-webkit-scrollbar-track {
  background: transparent;
}
.session-row {
  position: relative;
  padding: 10px 12px 9px 14px;
  border-bottom: 1px solid var(--board-hairline);
  cursor: pointer;
  transition: background-color 0.12s ease;
}
.session-row:hover {
  background: var(--board-bg-raised);
}
.session-row.selected {
  background: var(--amber);
}
.session-row.batch-checked {
  background: var(--board-bg-raised);
}
.session-row-main {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex: 1;
}
.session-dot {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
}
.session-dot.idle {
  background: var(--idle);
}
.session-dot.loading {
  background: var(--loading);
  animation: dot-pulse 1.2s ease-in-out infinite;
}
@keyframes dot-pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.35;
  }
}
.session-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--board-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.session-page {
  margin-left: auto;
  flex: none;
  max-width: 45%;
  font-size: 12px;
  color: var(--board-ink-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.session-row-sub {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 3px;
  padding-left: 15px;
  min-width: 0;
}
.session-note {
  font-size: 12px;
  color: var(--board-ink-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.session-status {
  margin-left: auto;
  flex: none;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--board-ink-dim);
}
.session-status.loading {
  color: var(--loading);
}
.session-menu {
  flex: none;
  display: none;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--board-ink-dim);
  font-size: 13px;
  cursor: pointer;
}
.session-row:hover .session-menu,
.session-row.selected .session-menu {
  display: inline-flex;
}
.session-menu:hover {
  background: var(--board-hover-veil);
  color: var(--board-ink);
}
.session-rename {
  min-width: 0;
  flex: 1;
  height: 22px;
  padding: 0 6px;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: inherit;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
}
.session-row.selected .session-rename {
  color: var(--amber-ink);
}
.session-rename:focus {
  outline: none;
  background: var(--board-hover-veil);
}
.session-row.selected .session-rename:focus {
  background: var(--amber-veil);
}
.session-row.selected .session-name,
.session-row.selected .session-note,
.session-row.selected .session-page {
  color: var(--amber-ink);
}
.session-row.selected .session-note,
.session-row.selected .session-page {
  opacity: 0.72;
}
.session-row.selected .session-status {
  color: var(--amber-ink);
}
.session-row.selected .session-dot.idle {
  background: var(--amber-ink);
}
.session-row.selected .session-menu {
  color: var(--amber-ink);
}
.session-row.selected .session-menu:hover {
  background: var(--amber-veil);
}
.ws-tag {
  flex: none;
  display: inline-flex;
  align-items: center;
  height: 16px;
  padding: 0 5px;
  border: 1px solid var(--board-tile-line);
  border-radius: 3px;
  background: var(--board-tile);
  color: var(--board-ink-dim);
  font-size: 10px;
  letter-spacing: 0.05em;
  white-space: nowrap;
}
.session-row.selected .ws-tag {
  background: transparent;
  border-color: transparent;
  color: var(--amber-ink);
  opacity: 0.72;
}
.session-check {
  flex: none;
  display: inline-flex;
  align-items: center;
}
.session-check input {
  position: absolute;
  width: 16px;
  height: 16px;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
.session-check .box {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border: 1px solid var(--board-control-line);
  border-radius: 4px;
  background: transparent;
  color: var(--amber-ink);
  font-size: 10px;
  pointer-events: none;
  transition: background-color 0.12s ease, border-color 0.12s ease;
}
.session-check input:checked + .box {
  background: var(--amber);
  border-color: var(--amber);
}
.session-check input:focus-visible + .box {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}
.list-empty {
  padding: 28px 16px;
  text-align: center;
}
.list-empty-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--board-ink);
}
.list-empty-sub {
  margin-top: 2px;
  font-size: 12px;
  color: var(--board-ink-dim);
}

/* ---------- 板脚（同源 app.css） ---------- */
.board-foot {
  flex: none;
  padding: 12px;
  border-top: 1px solid var(--board-hairline);
}
.new-session {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  height: 34px;
  border: none;
  border-radius: 6px;
  background: var(--amber);
  color: var(--amber-ink);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.12s ease;
}
.new-session:hover {
  background: var(--amber-strong);
}
.new-session:active {
  background: var(--amber-press);
}
.new-session:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}
.batch-bar {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.batch-bar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.batch-bar-left {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.batch-count {
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--board-ink-dim);
  font-variant-numeric: tabular-nums;
}
.batch-select-all {
  border: none;
  border-radius: 4px;
  background: transparent;
  padding: 0 6px;
  height: 20px;
  font-size: 12px;
  color: var(--board-ink);
  cursor: pointer;
  transition: background-color 0.12s ease;
}
.batch-select-all:hover {
  background: var(--board-bg-raised);
}
.batch-close-all {
  border: none;
  border-radius: 4px;
  background: transparent;
  padding: 0 6px;
  height: 20px;
  font-size: 12px;
  color: var(--danger);
  cursor: pointer;
  transition: background-color 0.12s ease;
}
.batch-close-all:hover {
  background: var(--board-hover-veil);
}

/* ---------- 右侧：Chrome 浏览器框架（同源 app.css） ---------- */
.browser-frame {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--chrome-surface);
}
.chrome-tabs {

.board-menu {
  position: fixed;
  z-index: 100;
  min-width: 148px;
  padding: 4px;
  border: 1px solid var(--board-hairline);
  border-radius: 6px;
  background: var(--board-bg-raised);
}
.board-menu-item {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 5px 10px;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--board-ink);
  font-size: 12px;
  text-align: left;
  cursor: pointer;
  white-space: nowrap;
}
.board-menu-item:hover {
  background: var(--board-hover-veil);
}
.board-menu-item.danger {
  color: var(--danger);
}
.board-menu-sub {
  display: none;
  position: absolute;
  left: calc(100% + 2px);
  top: -5px;
  min-width: 128px;
  padding: 4px;
  border: 1px solid var(--board-hairline);
  border-radius: 6px;
  background: var(--board-bg-raised);
}
.board-menu-item:hover .board-menu-sub {
  display: block;
}
.board-menu-arrow {
  color: var(--board-ink-dim);
  font-size: 10px;
}
.modal-mask {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--mask);
}
.modal-box {
  width: 360px;
  max-width: calc(100vw - 48px);
  padding: 18px 18px 16px;
  border: 1px solid var(--board-hairline);
  border-radius: 8px;
  background: var(--board-bg);
}
.modal-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--board-ink);
}
.modal-body {
  margin-top: 8px;
  font-size: 12px;
  color: var(--board-ink-dim);
  line-height: 1.7;
}
.modal-url-input {
  width: 100%;
  height: 28px;
  margin-top: 10px;
  padding: 0 10px;
  border: 1px solid var(--board-control-line);
  border-radius: 4px;
  background: var(--board-bg);
  color: var(--board-ink);
  font-family: inherit;
  font-size: 12px;
}
.modal-url-input:focus {
  outline: none;
  border-color: var(--board-ink-dim);
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}
.modal-btn {
  height: 28px;
  padding: 0 14px;
  border: 1px solid var(--board-control-line);
  border-radius: 4px;
  background: transparent;
  color: var(--board-ink);
  font-size: 12px;
  cursor: pointer;
  transition: background-color 0.12s ease;
}
.modal-btn:hover {
  background: var(--board-hover-veil);
}
.modal-btn.primary {
  border: none;
  background: var(--amber);
  color: var(--amber-ink);
  font-weight: 600;
}
.modal-btn.primary:hover {
  background: var(--amber-strong);
}
.modal-btn.primary:active {
  background: var(--amber-press);
}
.modal-btn.danger {
  border: none;
  background: var(--danger);
  color: #fff;
  font-weight: 600;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);
  z-index: 300;
  max-width: 60vw;
  padding: 7px 14px;
  border: 1px solid var(--board-hairline);
  border-radius: 6px;
  background: var(--board-bg-raised);
  color: var(--board-ink);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  animation: toast-in 0.2s ease;
}
@keyframes toast-in {
  from {
    opacity: 0;
    transform: translate(-50%, 6px);
  }
  to {
    opacity: 1;
    transform: translate(-50%, 0);
  }
}

/* ---------- 工具 ---------- */
function el(id) {
  return document.getElementById(id)
}
function wsName(id) {
  if (!id) return '未分组'
  var ws = state.workspaces.find(function (w) { return w.id === id })
  return ws ? ws.name : '未分组'
}
function activeSession() {
  return state.sessions.find(function (s) { return s.id === state.activeId }) || null
}
function visibleSessions() {
  if (state.view === 'all') return state.sessions
  return state.sessions.filter(function (s) { return s.ws === state.view })
}
function titleForUrl(url) {
  if (!url || url === 'about:blank') return '新标签页'
  try {
    return new URL(url).hostname
  } catch (e) {
    return url
  }
}
function rememberActive(session) {
  if (session && session.ws) state.wsLastActive[session.ws] = session.id
}

/* ---------- 渲染 ---------- */
var prevFlap = ''

function renderFlap() {
  var count = visibleSessions().length
  var str = String(Math.min(count, 99)).padStart(2, '0')
  var host = el('flapCounter')
  var html = ''
  for (var i = 0; i < str.length; i++) {
    var changed = prevFlap.length === str.length && prevFlap[i] !== str[i] ? ' flap-flip' : ''
    html += '<span class="flap-tile"><span class="flap-digit' + changed + '">' + str[i] + '</span></span>'
  }
  host.innerHTML = html
  host.setAttribute('aria-label', '当前视野会话 ' + count + ' 个')
  prevFlap = str
}

function renderWsBar() {
  var strip = el('workspaceStrip')
  var label = state.view === 'all' ? '全部会话' : wsName(state.view)
  strip.innerHTML =
    '<button class="ws-combobox' + (state.wsOpen ? ' open' : '') + '" id="wsCombobox" aria-haspopup="listbox" aria-expanded="' + state.wsOpen + '" title="切换工作区（可输入过滤）">' +
    '<span class="ws-combobox-label">' + escapeHtml(label) + '</span>' +
    '<span class="ws-combobox-caret">' + icon('down') + '</span>' +
    '</button>' +
    '<button class="ws-add" id="wsAddBtn" title="新建工作区（输入名称后回车）" aria-label="新建工作区">' + icon('plus') + '</button>'
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  })
}

function renderList() {
  var list = el('sessionList')
  var rows = visibleSessions()
  if (rows.length === 0) {
    var isWs = state.view !== 'all'
    list.innerHTML =
      '<li class="list-empty"><div class="list-empty-title">' +
      (isWs ? '该工作区尚无会话' : '尚无会话') +
      '</div><div class="list-empty-sub">' +
      (isWs ? '新建会话将加入此工作区' : '新建第一个隔离环境，并行测试多账号') +
      '</div></li>'
    return
  }
  var html = ''
  rows.forEach(function (s) {
    var selected = !state.batchMode && s.id === state.activeId
    var checked = !!state.checked[s.id]
    var renaming = state.renameSession === s.id
    var tab = s.tabs[s.activeTab] || { title: '' }
    var rowCls = 'session-row' + (state.batchMode ? (checked ? ' batch-checked' : '') : selected ? ' selected' : '')
    var tag = state.view === 'all' && s.ws !== null ? '<span class="ws-tag">' + escapeHtml(wsName(s.ws)) + '</span>' : ''
    if (state.view === 'all' && s.ws === null) tag = '<span class="ws-tag">未分组</span>'
    html +=
      '<li class="' + rowCls + '" data-id="' + s.id + '" tabindex="0" role="button" aria-pressed="' + selected + '">' +
      '<div class="session-row-main">' +
      (state.batchMode
        ? '<label class="session-check"><input type="checkbox" data-check="' + s.id + '"' + (checked ? ' checked' : '') +
          ' aria-label="勾选 ' + escapeHtml(s.name) + '" /><span class="box">' + icon('check') + '</span></label>'
        : '') +
      '<span class="session-dot ' + s.status + '"></span>' +
      (renaming
        ? '<input class="session-rename" id="sessionRenameInput" value="' + escapeHtml(s.name) + '" maxlength="40" aria-label="会话名称" />'
        : '<span class="session-name">' + escapeHtml(s.name) + '</span>') +
      '<span class="session-page" title="' + escapeHtml(tab.title) + '">' + escapeHtml(tab.title) + '</span>' +
      '</div>' +
      '<div class="session-row-sub">' + tag +
      '<span class="session-note" title="' + escapeHtml(s.note || '未填写备注') + '">' + escapeHtml(s.note || '未填写备注') + '</span>' +
      '<span class="session-status ' + s.status + '">' + (s.status === 'loading' ? '加载中' : '空闲') + '</span>' +
      (state.batchMode ? '' : '<button class="session-menu" data-menu="' + s.id + '" title="会话操作" aria-label="会话操作">' + icon('more') + '</button>') +
      '</div>' +
      '</li>'
  })
  list.innerHTML = html
  var renameInput = el('sessionRenameInput')
  if (renameInput) {
    renameInput.focus()
    renameInput.select()
    var sid = state.renameSession
    renameInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        commitSessionRename(sid, renameInput.value)
      } else if (e.key === 'Escape') {
        e.stopPropagation()
        state.renameSession = null
        renderList()
      }
    })
    renameInput.addEventListener('blur', function () {
      if (state.renameSession === sid) commitSessionRename(sid, renameInput.value)
    })
    renameInput.addEventListener('click', function (e) { e.stopPropagation() })
  }
}

function renderFoot() {
  var foot = el('boardFoot')
  if (state.batchMode) {
    var rows = visibleSessions()
    var allChecked = rows.length > 0 && rows.every(function (s) { return state.checked[s.id] })
    var n = rows.filter(function (s) { return state.checked[s.id] }).length
    foot.innerHTML =
      '<div class="batch-bar">' +
      '<div class="batch-bar-row">' +
      '<span class="batch-bar-left"><span class="batch-count">已选 ' + n + '</span>' +
      '<button class="batch-select-all" id="batchSelectAll">' + (allChecked ? '取消全选' : '全选') + '</button></span>' +
      '<button class="batch-close-all" id="batchCloseAll">关闭全部会话</button>' +
      '</div>' +
      '<button class="new-session" id="batchOpenUrl"' + (n === 0 ? ' disabled' : '') + '>打开测试地址</button>' +
      '</div>'
    el('batchSelectAll').addEventListener('click', function () {
      rows.forEach(function (s) {
        if (allChecked) delete state.checked[s.id]
        else state.checked[s.id] = true
      })
      renderFoot()
    })
    el('batchCloseAll').addEventListener('click', function () {
      openModal({
        title: '关闭全部会话',
        body: '将永久删除全部 ' + state.sessions.length + ' 个会话及其本地数据，且不可恢复。',
        okText: '全部关闭',
        danger: true,
        onOk: function () {
          state.sessions = []
          state.checked = {}
          state.activeId = null
          state.wsLastActive = {}
          exitBatch()
          showToast('已关闭全部会话')
          renderAll()
        }
      })
    })
    el('batchOpenUrl').addEventListener('click', function () {
      openUrlModal(rows.filter(function (s) { return state.checked[s.id] }))
    })
  } else {
    foot.innerHTML =
      '<button class="new-session" id="newSessionBtn">' + icon('plus') + '新建会话</button>'
    el('newSessionBtn').addEventListener('click', function () {
      var id = 's' + Date.now()
      var ws = state.view === 'all' ? null : state.view
      state.sessions.push(
        mkSession(id, ws, '新建会话', '未填写备注', [mkTab('新标签页', 'about:blank')], 0)
      )
      activate(id)
      showToast(ws ? '已在「' + wsName(ws) + '」新建会话' : '已在「未分组」新建会话')
      renderAll()
    })
  }
}

function renderHead() {
  var batchBtn = el('batchToggle')
  batchBtn.innerHTML = icon('checkSquare')
  batchBtn.classList.toggle('active', state.batchMode)
  batchBtn.title = state.batchMode ? '退出批量模式' : '批量操作'
  batchBtn.disabled = state.sessions.length === 0 && !state.batchMode
  var appBtn = el('appearanceToggle')
  appBtn.innerHTML = icon(state.theme === 'light' ? 'sun' : 'moon')
  appBtn.title = state.theme === 'light' ? '切换到黑夜（演示）' : '切换到白天（演示）'
  appBtn.setAttribute('aria-label', appBtn.title)
}

function renderBrowser() {
  var s = activeSession()
  var tabsHost = el('chromeTabs')
  var omnibox = el('omnibox')
  var content = el('chromeContent')
  var hasSession = !!s

  el('navBack').disabled = !hasSession || !canBack(s)
  el('navForward').disabled = !hasSession || !canForward(s)
  el('navReload').disabled = !hasSession
  el('navHome').disabled = !hasSession
  omnibox.disabled = !hasSession
  el('devtoolsToggle').disabled = !hasSession

  if (!hasSession) {
    tabsHost.innerHTML = ''
    omnibox.value = ''
    content.innerHTML =
      '<div class="chrome-empty-title">尚无会话</div><div class="chrome-empty-sub">在左侧新建或选择会话，开始隔离浏览</div>'
    state.devtoolsOpen = false
    syncDevtools()
    return
  }

  var html = ''
  s.tabs.forEach(function (t, i) {
    var fav = t.loading
      ? '<span class="chrome-tab-favicon">' + icon('loading', 'icon-spin') + '</span>'
      : '<span class="chrome-tab-favicon"><span class="chrome-tab-favicon-dot"></span></span>'
    var closeDisabled = s.tabs.length === 1 ? ' disabled' : ''
    html +=
      '<div class="chrome-tab' + (i === s.activeTab ? ' active' : '') + '" data-tab="' + i + '" tabindex="0" role="tab"' +
      (i === s.activeTab ? ' aria-selected="true"' : '') + '>' + fav +
      '<span class="chrome-tab-title">' + escapeHtml(t.title) + '</span>' +
      '<button class="chrome-tab-close" data-close="' + i + '" title="关闭标签页"' + closeDisabled + '>' + icon('close') + '</button>' +
      '</div>'
  })
  html += '<button class="chrome-newtab" id="newTabBtn" title="新建标签页" aria-label="新建标签页">' + icon('plus') + '</button>'
  tabsHost.innerHTML = html

  var tab = s.tabs[s.activeTab]
  if (document.activeElement !== omnibox) omnibox.value = tab.url
  content.innerHTML =
    '<div class="page-ph-title">' + escapeHtml(tab.title) + '</div>' +
    '<div class="page-ph-sub">演示占位页面 · 「' + escapeHtml(s.name) + '」的隔离会话（' + escapeHtml(tab.url) + '）</div>'
  syncDevtools()
}

function syncDevtools() {
  var toggle = el('devtoolsToggle')
  toggle.setAttribute('aria-pressed', String(state.devtoolsOpen))
  toggle.title = state.devtoolsOpen ? '关闭开发者工具（演示）' : '打开开发者工具（演示，F12）'
  el('devtoolsPane').hidden = !state.devtoolsOpen
}

function renderAll() {
  renderHead()
  renderFlap()
  renderWsBar()
  renderList()
  renderFoot()
  renderBrowser()
}

/* ---------- 交互：工作区（下拉 combobox） ---------- */
var wsPanelEl = null

function closeWsPanel() {
  state.wsOpen = false
  state.wsFilter = ''
  state.wsActive = 0
  if (wsPanelEl) {
    wsPanelEl.remove()
    wsPanelEl = null
  }
  renderWsBar()
}

function wsAllOptions() {
  return [{ id: 'all', name: '全部会话' }].concat(state.workspaces)
}
function wsOptions() {
  var f = state.wsFilter.trim().toLowerCase()
  if (!f) return wsAllOptions()
  return wsAllOptions().filter(function (o) {
    return o.name.toLowerCase().indexOf(f) !== -1
  })
}
/* 过滤词不构成既有名称的精确命中时，尾行提供「新建工作区「词」」 */
function wsCreateCandidate() {
  var name = state.wsFilter.trim()
  if (!name) return null
  var exact = wsAllOptions().some(function (o) {
    return o.name === name
  })
  return exact ? null : name
}
function wsSelectable() {
  var opts = wsOptions()
  var create = wsCreateCandidate()
  return create ? opts.concat([{ create: create }]) : opts
}

function openWsPanel() {
  closeMenu()
  state.wsOpen = true
  state.wsFilter = ''
  state.wsActive = 0
  renderWsBar()
  wsPanelEl = document.createElement('div')
  wsPanelEl.className = 'ws-panel'
  wsPanelEl.setAttribute('role', 'listbox')
  wsPanelEl.setAttribute('aria-label', '工作区')
  wsPanelEl.innerHTML =
    '<div class="ws-search-host">' +
    '<span class="ws-search-icon">' + icon('search') + '</span>' +
    '<input class="ws-search" id="wsSearch" placeholder="输入以过滤工作区" aria-label="过滤工作区" spellcheck="false" maxlength="20" />' +
    '</div>' +
    '<div class="ws-options" id="wsOptions"></div>'
  document.body.appendChild(wsPanelEl)
  var box = el('wsCombobox').getBoundingClientRect()
  wsPanelEl.style.width = Math.max(160, Math.round(box.width)) + 'px'
  wsPanelEl.style.left = Math.round(box.left) + 'px'
  wsPanelEl.style.top = Math.round(box.bottom + 4) + 'px'

  var input = el('wsSearch')
  input.focus()
  input.addEventListener('input', function () {
    state.wsFilter = input.value
    state.wsActive = 0
    renderWsOptions()
  })
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault()
      var n = wsSelectable().length
      if (n === 0) return
      state.wsActive = (state.wsActive + (e.key === 'ArrowDown' ? 1 : -1) + n) % n
      renderWsOptions()
    } else if (e.key === 'Enter') {
      e.preventDefault()
      pickWsActive()
    } else if (e.key === 'Escape') {
      e.stopPropagation()
      closeWsPanel()
    }
  })
  wsPanelEl.addEventListener('click', function (e) {
    var row = e.target.closest('.ws-option')
    if (!row) return
    if (row.id === 'wsCreateRow') {
      createWorkspace(wsCreateCandidate())
      return
    }
    closeWsPanel()
    switchView(row.dataset.ws)
  })
  wsPanelEl.addEventListener('contextmenu', function (e) {
    var row = e.target.closest('.ws-option')
    if (!row || row.id === 'wsCreateRow' || row.dataset.ws === 'all') return
    e.preventDefault()
    var id = row.dataset.ws
    openMenu(
      [
        { label: '重命名', onClick: function () { openRenameWsModal(id) } },
        { label: '删除工作区', danger: true, onClick: function () { deleteWs(id) } }
      ],
      e.clientX,
      e.clientY
    )
  })
  renderWsOptions()
}

function renderWsOptions() {
  var host = el('wsOptions')
  if (!host) return
  var opts = wsOptions()
  var create = wsCreateCandidate()
  var html = ''
  opts.forEach(function (o, i) {
    html +=
      '<button class="ws-option' + (o.id === state.view ? ' current' : '') + (i === state.wsActive ? ' active' : '') +
      '" data-ws="' + o.id + '" data-idx="' + i + '" role="option" aria-selected="' + (o.id === state.view) + '">' +
      '<span class="ws-option-name">' + escapeHtml(o.name) + '</span>' +
      '<span class="ws-option-check">' + icon('check') + '</span>' +
      '</button>'
  })
  if (create) {
    html +=
      '<button class="ws-option ws-option-create' + (opts.length === state.wsActive ? ' active' : '') +
      '" id="wsCreateRow" data-idx="' + opts.length + '" role="option">' +
      '<span class="ws-create-icon">' + icon('plus') + '</span>' +
      '<span class="ws-option-name">新建工作区「' + escapeHtml(create) + '」</span>' +
      '</button>'
  }
  if (opts.length === 0 && !create) {
    html = '<div class="ws-option-empty">无匹配工作区</div>'
  }
  host.innerHTML = html
}

function pickWsActive() {
  var row = wsSelectable()[state.wsActive]
  if (!row) return
  if (row.create) {
    createWorkspace(row.create)
    return
  }
  closeWsPanel()
  switchView(row.id)
}

function createWorkspace(name) {
  if (state.workspaces.some(function (w) { return w.name === name })) {
    showToast('已有同名工作区')
    return
  }
  var id = 'ws' + Date.now()
  state.workspaces.push({ id: id, name: name })
  closeWsPanel()
  state.view = id
  state.activeId = null
  showToast('已新建工作区「' + name + '」')
  renderAll()
}

function switchView(id) {
  state.view = id
  if (id !== 'all') {
    var cur = activeSession()
    if (!cur || cur.ws !== id) {
      var target = null
      var remembered = state.wsLastActive[id]
      if (remembered) target = state.sessions.find(function (s) { return s.id === remembered && s.ws === id })
      if (!target) target = state.sessions.find(function (s) { return s.ws === id }) || null
      state.activeId = target ? target.id : null
    }
  }
  renderAll()
}
function openRenameWsModal(id) {
  openModal({
    title: '重命名工作区',
    body: '为工作区「' + wsName(id) + '」输入新名称。',
    input: { value: wsName(id), aria: '工作区名称' },
    okText: '保存',
    onOk: function (value) {
      var name = value.trim()
      if (!name) return
      if (state.workspaces.some(function (w) { return w.name === name && w.id !== id })) {
        showToast('已有同名工作区')
        return
      }
      state.workspaces.find(function (w) { return w.id === id }).name = name
      showToast('已重命名工作区')
      renderAll()
      if (state.wsOpen) renderWsOptions()
    }
  })
}
function deleteWs(id) {
  var count = state.sessions.filter(function (s) { return s.ws === id }).length
  openModal({
    title: '删除工作区',
    body:
      '将删除工作区「' + wsName(id) + '」。' +
      (count > 0 ? '其中 ' + count + ' 个会话将移入「未分组」，会话与其数据不受影响。' : '该工作区没有会话。'),
    okText: '删除',
    danger: true,
    onOk: function () {
      state.sessions.forEach(function (s) {
        if (s.ws === id) s.ws = null
      })
      state.workspaces = state.workspaces.filter(function (w) { return w.id !== id })
      delete state.wsLastActive[id]
      if (state.view === id) state.view = 'all'
      showToast('工作区已删除' + (count > 0 ? '，' + count + ' 个会话移入未分组' : ''))
      renderAll()
      if (state.wsOpen) renderWsOptions()
    }
  })
}

/* ---------- 交互：会话 ---------- */
function activate(id) {
  state.activeId = id
  var s = state.sessions.find(function (x) { return x.id === id })
  rememberActive(s)
}
function commitSessionRename(id, value) {
  state.renameSession = null
  var name = value.trim()
  var s = state.sessions.find(function (x) { return x.id === id })
  if (s && name) s.name = name
  renderAll()
}
function cloneSession(id) {
  var src = state.sessions.find(function (x) { return x.id === id })
  if (!src) return
  var copy = mkSession('s' + Date.now(), src.ws, src.name + ' 副本', src.note, src.tabs.map(function (t) {
    return mkTab(t.title, t.url)
  }), src.activeTab, 'idle')
  state.sessions.push(copy)
  activate(copy.id)
  showToast('已克隆「' + src.name + '」')
  renderAll()
}
function deleteSession(id) {
  var s = state.sessions.find(function (x) { return x.id === id })
  if (!s) return
  openModal({
    title: '删除会话',
    body: '将永久删除「' + s.name + '」及其全部本地数据，且不可恢复。',
    okText: '删除',
    danger: true,
    onOk: function () {
      state.sessions = state.sessions.filter(function (x) { return x.id !== id })
      delete state.checked[id]
      Object.keys(state.wsLastActive).forEach(function (k) {
        if (state.wsLastActive[k] === id) delete state.wsLastActive[k]
      })
      if (state.activeId === id) {
        var next = visibleSessions()[0]
        state.activeId = next ? next.id : null
        rememberActive(next)
      }
      renderAll()
    }
  })
}
function moveSession(id, ws) {
  var s = state.sessions.find(function (x) { return x.id === id })
  if (!s || s.ws === ws) return
  s.ws = ws
  rememberActive(s)
  showToast('「' + s.name + '」已移入「' + wsName(ws) + '」')
  renderAll()
}

/* ---------- 批量 ---------- */
function exitBatch() {
  state.batchMode = false
  state.checked = {}
}
function openUrlModal(targets) {
  openModal({
    title: '批量打开测试地址',
    body: '将为 ' + targets.length + ' 个勾选会话各新建一个 Tab 加载该地址。',
    input: { value: 'https://test.example.com/login', aria: '测试地址' },
    okText: '打开',
    onOk: function (url) {
      targets.forEach(function (s) {
        s.tabs.push(mkTab(titleForUrl(url), url))
        s.activeTab = s.tabs.length - 1
      })
      showToast('已在 ' + targets.length + ' 个会话打开 ' + url)
      renderAll()
    }
  })
}

/* ---------- 浮层组件 ---------- */
var menuEl = null
function closeMenu() {
  if (menuEl) {
    menuEl.remove()
    menuEl = null
  }
}
function openMenu(items, x, y) {
  closeMenu()
  menuEl = document.createElement('div')
  menuEl.className = 'board-menu'
  menuEl.setAttribute('role', 'menu')
  items.forEach(function (item) {
    var child = document.createElement('button')
    child.className = 'board-menu-item' + (item.danger ? ' danger' : '')
    child.setAttribute('role', 'menuitem')
    child.innerHTML = '<span>' + escapeHtml(item.label) + '</span>'
    if (item.sub) {
      child.innerHTML += '<span class="board-menu-arrow">' + icon('arrowRightSmall') + '</span>'
      var sub = document.createElement('span')
      sub.className = 'board-menu-sub'
      item.sub.forEach(function (subItem) {
        var subBtn = document.createElement('button')
        subBtn.className = 'board-menu-item'
        subBtn.textContent = subItem.label
        subBtn.addEventListener('click', function (e) {
          e.stopPropagation()
          closeMenu()
          subItem.onClick()
        })
        sub.appendChild(subBtn)
      })
      child.appendChild(sub)
    } else {
      child.addEventListener('click', function () {
        closeMenu()
        item.onClick()
      })
    }
    menuEl.appendChild(child)
  })
  document.body.appendChild(menuEl)
  var rect = menuEl.getBoundingClientRect()
  var left = Math.min(x, window.innerWidth - rect.width - 8)
  var top = Math.min(y, window.innerHeight - rect.height - 8)
  menuEl.style.left = Math.max(8, left) + 'px'
  menuEl.style.top = Math.max(8, top) + 'px'
  menuEl.addEventListener('contextmenu', function (e) { e.preventDefault() })
}

var modalEl = null
function closeModal() {
  if (modalEl) {
    modalEl.remove()
    modalEl = null
  }
}
function openModal(opts) {
  closeModal()
  modalEl = document.createElement('div')
  modalEl.className = 'modal-mask'
  var box = document.createElement('div')
  box.className = 'modal-box'
  box.setAttribute('role', 'dialog')
  box.setAttribute('aria-modal', 'true')
  box.innerHTML =
    '<div class="modal-title">' + escapeHtml(opts.title) + '</div>' +
    '<div class="modal-body">' + escapeHtml(opts.body) + '</div>' +
    (opts.input
      ? '<input class="modal-url-input" id="modalInput" value="' + escapeHtml(opts.input.value) + '" spellcheck="false" aria-label="' + escapeHtml(opts.input.aria) + '"' +
        (opts.input.maxlength ? ' maxlength="' + opts.input.maxlength + '"' : '') + ' />'
      : '') +
    '<div class="modal-actions">' +
    '<button class="modal-btn" data-act="cancel">取消</button>' +
    '<button class="modal-btn ' + (opts.danger ? 'danger' : 'primary') + '" data-act="ok">' + escapeHtml(opts.okText || '确定') + '</button>' +
    '</div>'
  modalEl.appendChild(box)
  modalEl.addEventListener('mousedown', function (e) {
    if (e.target === modalEl) closeModal()
  })
  box.querySelector('[data-act="cancel"]').addEventListener('click', closeModal)
  box.querySelector('[data-act="ok"]').addEventListener('click', function () {
    if (opts.input) {
      var value = el('modalInput').value.trim()
      if (!value) {
        el('modalInput').focus()
        return
      }
      closeModal()
      opts.onOk(value)
    } else {
      closeModal()
      opts.onOk()
    }
  })
  document.body.appendChild(modalEl)
  var input = el('modalInput')
  if (input) {
    input.focus()
    input.select()
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') box.querySelector('[data-act="ok"]').click()
    })
  } else {
    box.querySelector('[data-act="ok"]').focus()
  }
}

var toastTimer = null
function showToast(text) {
  var old = document.querySelector('.toast')
  if (old) old.remove()
  var t = document.createElement('div')
  t.className = 'toast'
  t.setAttribute('role', 'status')
  t.textContent = text
  document.body.appendChild(t)
  clearTimeout(toastTimer)
  toastTimer = setTimeout(function () { t.remove() }, 2600)
}

/* ---------- 浏览器 mock ---------- */
function canBack(s) {
  var t = s.tabs[s.activeTab]
  return t && t.hi > 0
}
function canForward(s) {
  var t = s.tabs[s.activeTab]
  return t && t.hi < t.hist.length - 1
}
function activeTabOf(s) {
  return s.tabs[s.activeTab]
}
function navigate(s, url) {
  var t = activeTabOf(s)
  if (t.url === url) return
  t.hist = t.hist.slice(0, t.hi + 1).concat([url])
  t.hi = t.hist.length - 1
  t.url = url
  t.title = titleForUrl(url)
  renderBrowser()
  renderList()
}
function fakeLoad() {
  var s = activeSession()
  if (!s || s.status === 'loading') return
  var tab = activeTabOf(s)
  s.status = 'loading'
  tab.loading = true
  renderBrowser()
  renderList()
  setTimeout(function () {
    s.status = 'idle'
    tab.loading = false
    renderBrowser()
    renderList()
  }, 1200)
}

/* ---------- 事件接线 ---------- */
el('workspaceStrip').addEventListener('click', function (e) {
  if (e.target.closest('#wsAddBtn')) {
    openWsPanel()
    return
  }
  if (e.target.closest('#wsCombobox')) {
    if (state.wsOpen) closeWsPanel()
    else openWsPanel()
  }
})

el('sessionList').addEventListener('click', function (e) {
  var check = e.target.closest('input[type="checkbox"]')
  if (check) {
    if (check.checked) state.checked[check.dataset.check] = true
    else delete state.checked[check.dataset.check]
    renderList()
    renderFoot()
    return
  }
  var menuBtn = e.target.closest('.session-menu')
  if (menuBtn) {
    e.stopPropagation()
    openSessionMenu(menuBtn.dataset.menu, menuBtn)
    return
  }
  var row = e.target.closest('.session-row')
  if (!row) return
  var id = row.dataset.id
  if (state.batchMode) {
    if (state.checked[id]) delete state.checked[id]
    else state.checked[id] = true
    renderList()
    renderFoot()
  } else {
    activate(id)
    renderAll()
  }
})
el('sessionList').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return
  var row = e.target.closest('.session-row')
  if (!row || state.renameSession) return
  e.preventDefault()
  if (state.batchMode) {
    if (state.checked[row.dataset.id]) delete state.checked[row.dataset.id]
    else state.checked[row.dataset.id] = true
    renderList()
    renderFoot()
  } else {
    activate(row.dataset.id)
    renderAll()
  }
})

function openSessionMenu(id, anchor) {
  var s = state.sessions.find(function (x) { return x.id === id })
  if (!s) return
  var rect = anchor.getBoundingClientRect()
  var sub = state.workspaces
    .filter(function (w) { return w.id !== s.ws })
    .map(function (w) {
      return { label: w.name, onClick: function () { moveSession(id, w.id) } }
    })
  if (s.ws !== null) sub.push({ label: '移出（未分组）', onClick: function () { moveSession(id, null) } })
  openMenu(
    [
      { label: '重命名', onClick: function () { state.renameSession = id; renderList() } },
      { label: '克隆会话', onClick: function () { cloneSession(id) } },
      { label: '移动到工作区', sub: sub },
      { label: '删除会话', danger: true, onClick: function () { deleteSession(id) } }
    ],
    rect.left,
    rect.bottom + 4
  )
}

el('batchToggle').addEventListener('click', function () {
  if (state.batchMode) exitBatch()
  else {
    state.batchMode = true
    state.renameSession = null
  }
  renderAll()
})
el('appearanceToggle').addEventListener('click', function () {
  state.theme = state.theme === 'light' ? 'dark' : 'light'
  document.documentElement.dataset.theme = state.theme
  renderHead()
})

el('chromeTabs').addEventListener('click', function (e) {
  var s = activeSession()
  if (!s) return
  var newTab = e.target.closest('#newTabBtn')
  if (newTab) {
    s.tabs.push(mkTab('新标签页', 'about:blank'))
    s.activeTab = s.tabs.length - 1
    renderBrowser()
    renderList()
    return
  }
  var closeBtn = e.target.closest('.chrome-tab-close')
  if (closeBtn && !closeBtn.disabled) {
    e.stopPropagation()
    var ci = Number(closeBtn.dataset.close)
    s.tabs.splice(ci, 1)
    if (s.activeTab >= s.tabs.length) s.activeTab = s.tabs.length - 1
    renderBrowser()
    renderList()
    return
  }
  var tab = e.target.closest('.chrome-tab')
  if (tab) {
    s.activeTab = Number(tab.dataset.tab)
    renderBrowser()
    renderList()
  }
})

el('omnibox').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || e.isComposing) return
  var s = activeSession()
  if (!s) return
  var raw = el('omnibox').value.trim()
  if (!raw) return
  var url = /^https?:\/\//i.test(raw) || raw === 'about:blank' ? raw : 'https://' + raw
  navigate(s, url)
  el('omnibox').blur()
})
el('navBack').addEventListener('click', function () {
  var s = activeSession()
  var t = s && activeTabOf(s)
  if (t && t.hi > 0) {
    t.hi--
    t.url = t.hist[t.hi]
    t.title = titleForUrl(t.url)
    renderBrowser()
    renderList()
  }
})
el('navForward').addEventListener('click', function () {
  var s = activeSession()
  var t = s && activeTabOf(s)
  if (t && t.hi < t.hist.length - 1) {
    t.hi++
    t.url = t.hist[t.hi]
    t.title = titleForUrl(t.url)
    renderBrowser()
    renderList()
  }
})
el('navReload').addEventListener('click', fakeLoad)
el('navHome').addEventListener('click', function () {
  var s = activeSession()
  if (s) navigate(s, 'about:blank')
})
el('devtoolsToggle').addEventListener('click', function () {
  state.devtoolsOpen = !state.devtoolsOpen
  syncDevtools()
})
el('devtoolsClose').addEventListener('click', function () {
  state.devtoolsOpen = false
  syncDevtools()
})

;['navBack', 'navForward', 'navReload', 'navHome'].forEach(function (id) {
  el(id).innerHTML = icon({ navBack: 'left', navForward: 'right', navReload: 'reload', navHome: 'home' }[id] || '')
})
el('devtoolsClose').innerHTML = icon('close')

/* 分隔条拖拽（220–420） */
; (function () {
  var divider = el('panelDivider')
  var panel = el('panelLeft')
  var startX = 0
  var startW = 0
  divider.addEventListener('pointerdown', function (e) {
    startX = e.clientX
    startW = panel.getBoundingClientRect().width
    divider.setPointerCapture(e.pointerId)
    document.body.classList.add('col-resizing')
  })
  divider.addEventListener('pointermove', function (e) {
    if (!document.body.classList.contains('col-resizing')) return
    var w = Math.round(Math.max(220, Math.min(420, startW + e.clientX - startX)))
    panel.style.width = w + 'px'
  })
  divider.addEventListener('pointerup', function (e) {
    divider.releasePointerCapture(e.pointerId)
    document.body.classList.remove('col-resizing')
  })
})()

/* 全局：外点关菜单 / Esc 层级退出 */
document.addEventListener('mousedown', function (e) {
  if (menuEl && !menuEl.contains(e.target)) closeMenu()
  if (wsPanelEl && !wsPanelEl.contains(e.target) && !e.target.closest('#workspaceStrip')) closeWsPanel()
})
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return
  if (state.wsOpen) {
    closeWsPanel()
    return
  }
  if (menuEl) {
    closeMenu()
    return
  }
  if (modalEl) {
    closeModal()
    return
  }
  if (state.renameSession !== null) {
    state.renameSession = null
    renderList()
    return
  }
  if (state.batchMode) {
    exitBatch()
    renderAll()
  }
})
window.addEventListener('resize', function () {
  closeMenu()
  if (wsPanelEl) closeWsPanel()
})

renderAll()
</script>
</body>
</html>
