<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>msb-recording-collector</title>
  </head>
  <body>
    <script>
      // 采集器页（录屏线 A' 架构，计划 20261009231903 步骤 5）：本页运行在被录会话
      // 分区的 WebContentsView 里，是 getDisplayMedia 的发起方（spike 结论：授予方与
      // 目标须同 session，跨 session 授予 Timeout）。主进程在分区 session 注册的
      // setDisplayMediaRequestHandler 会把被录 Tab 的 WebFrameMain 授予本页。
      // 本页与主进程的全部通信经 preload 暴露的 window.__msbCapture（capturePreload.ts）。
      ;(() => {
        const cap = window.__msbCapture
        // 上行 invoke 的拒绝只发生在通道已注销（主进程已回收采集器）场景——届时无上报
        // 对象，统一静默豁免防 unhandledrejection 噪音（MP4 化复审 20261021123907 低-5）；
        // saveChunk 不经此豁免：其拒绝是链内上报 reportError 的信号
        const ignore = (p) => {
          if (p && typeof p.catch === 'function') p.catch(() => {})
        }
        let recorder = null
        // 就绪前指令排队（审查高-2① + 二审中-1 修复）：页面加载/getDisplayMedia 握手
        // 窗口内到达的指令不丢弃——stop 排队后不再 start（该录制被取消）；pause 排队
        // 为布尔（pause/resume 快速交替收敛为最终态），recorder 建立后立即应用，
        // 保证「暂停期间不落帧」从 UI 暂停时刻成立
        let pendingStop = false
        let pendingPause = false
        cap.onCommand(async (cmd) => {
          if (!recorder) {
            if (cmd === 'stop') pendingStop = true
            else if (cmd === 'pause') pendingPause = true
            else if (cmd === 'resume') pendingPause = false
            return
          }
          try {
            if (cmd === 'pause' && recorder.state === 'recording') {
              recorder.pause()
            } else if (cmd === 'resume' && recorder.state === 'paused') {
              recorder.resume()
            } else if (cmd === 'stop' && recorder.state !== 'inactive') {
              recorder.stop()
            }
          } catch (err) {
            ignore(cap.reportError('command ' + cmd + ': ' + String(err)))
          }
        })
        ;(async () => {
          try {
            const stream = await navigator.mediaDevices.getDisplayMedia({
              video: true,
              audio: false
            })
            if (pendingStop) {
              // 排队中的 stop：不 start，直接收尾上报（tracks 释放 + stopped）
              stream.getTracks().forEach((t) => t.stop())
              ignore(cap.reportStopped())
              return
            }
            // 封装 MP4（2026-10-20 用户裁决，计划 20261020184445）：Chromium 126+ 起
            // MediaRecorder 原生 MP4（H.264），Electron 39/Chromium 142 实测 isTypeSupported
            // 为 true；不支持环境构造即抛，经 reportError 走既有启动失败路径如实报错，
            // 不做 webm 回退（回退需把所选容器上行主进程同步扩展名，见计划 2.2）
            recorder = new MediaRecorder(stream, { mimeType: 'video/mp4;codecs=avc1' })
            // 分块上行串行链（MP4 化专项 20261020184445 修复）：saveChunk 原为未 await
            // 的浮动 Promise，MP4 封装把数据留到 stop 冲刷，末块会与 onstop 的
            // reportStopped 竞速——主进程 settle 见 stopped 即 finalize，晚到的分块
            // 落空即整段丢失（静态页全部分块都在 stop 冲刷，竞态必输）。链式串行 +
            // onstop 等链排空后再上报，保证分块恒先于 stopped 到达主进程
            let chunkChain = Promise.resolve()
            recorder.ondataavailable = (e) => {
              if (e.data && e.data.size > 0) {
                chunkChain = chunkChain.then(async () => {
                  try {
                    // Blob → ArrayBuffer：contextBridge 结构化克隆对二进制缓冲稳定
                    await cap.saveChunk(await e.data.arrayBuffer())
                  } catch (err) {
                    ignore(cap.reportError('chunk: ' + String(err)))
                  }
                })
              }
            }
            recorder.onerror = () => {
              ignore(cap.reportError('mediarecorder error'))
            }
            recorder.onstop = () => {
              stream.getTracks().forEach((t) => t.stop())
              // chunkChain 链内已把错误转 reportError、自身永不 reject，排空即末块已上行
              void chunkChain.then(() => ignore(cap.reportStopped()))
            }
            ignore(cap.ready())
            recorder.start(500)
            if (pendingPause) {
              // 排队的 pause：start 后立即暂停（首帧后即停），暂停段不落帧
              recorder.pause()
              pendingPause = false
            }
          } catch (err) {
            ignore(cap.reportError('start: ' + String(err)))
          }
        })()
      })()
    </script>
  </body>
</html>
